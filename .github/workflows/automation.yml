# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Run tests

on:
  workflow_call:
    inputs:
      package:
        description: api | ui
        required: true
        type: string

jobs:
  validate-checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Validate Checkstyle
        run: ./mvnw validate

  run-tests:
    needs: validate-checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TeamCity Setup
        uses: ./.github/actions/teamcity-setup # TeamCity Setup включает установку Java
        # Это локальный composite action
        # не создаёт новую машину
        #
        #выполняется внутри job

      - name: Run tests
        continue-on-error: true
        # указываем группу, чтобы не запустить тесты, связанные с сетапом TeamCity
        run: ./mvnw test -Dtest='com.example.teamcity.${{ inputs.package }}.**' -Dgroups=Regression

      - name: Grant execute permission to swagger-coverage
        if: ${{ inputs.package == 'api' }}
        run: chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline

      # Ссоздаем репорт с покрытием АПИ тестов, основанном на Сваггер документации
      - name: Run Swagger Coverage
        continue-on-error: true
        if: ${{ inputs.package == 'api' }}
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://$HOST:8111/app/rest/swagger.json -i target/swagger-coverage-output
      # Сохраняем Сваггер репорт в артефакты ГитХаб actions
      - name: Save Swagger Coverage
        uses: actions/upload-artifact@v4
        if: ${{ inputs.package == 'api' }}
        with:
          name: swagger-coverage
          path: |
            swagger-coverage-report.html
            swagger-coverage-results.json

      # Загружаем историю Allure Report из ветки gh-pages
      - name: Checkout GitHub Pages with previous Allure reports
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Устанавливаем Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # Генерируем Allure Report с историей
      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-history/${{ inputs.package }}
          allure generate target/allure-results \
            -o allure-history/${{ inputs.package }} \
            --clean

      # Публикуем отчёт в GitHub Pages
      - name: Publish Allure report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true









